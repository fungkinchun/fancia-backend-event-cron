spring:
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      allow-pool-suspension: true
      maximum-pool-size: "${MAX_POOL_SIZE:2}"
      minimum-idle: "${MIN_IDLE:0}"
      connection-timeout: 5000
      validation-timeout: 1000
      idle-timeout: 60000
      max-lifetime: 180000
      keepalive-time: 0
      initialization-fail-timeout: "-1"
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  cloud:
    aws:
      secretsmanager:
        endpoint: http://localhost:4566
        region: ${AWS_REGION}
      credentials:
        access-key: test
        secret-key: test
    kubernetes:
      discovery:
        enabled: false
  flyway:
    enabled: false

app:
  application-name: ${PROJECT_NAME:fancia}-backend-${REPO_NAME:event-cron}

logging:
  level:
    root: INFO
    com.fancia.backend.event: DEBUG
