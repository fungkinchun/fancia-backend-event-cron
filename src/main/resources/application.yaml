spring:
  main:
    web-application-type: none
    banner-mode: off
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.cloud.openfeign.FeignAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.cloud.kubernetes.client.KubernetesClientAutoConfiguration
      - org.springframework.cloud.kubernetes.client.discovery.KubernetesDiscoveryClientAutoConfiguration
      - org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  application-name: ${PROJECT_NAME:fancia}-backend-${REPO_NAME:event-cron}

logging:
  level:
    com.fancia.backend.event: INFO
