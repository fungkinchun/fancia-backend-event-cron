spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver}
    hikari:
      allow-pool-suspension: true
      maximum-pool-size: ${MAX_POOL_SIZE:5}
      minimum-idle: ${MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 480000
      keepalive-time: 120000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  cloud:
    kubernetes:
      discovery:
        enabled: false
  flyway:
    enabled: false

app:
  application-name: ${PROJECT_NAME}-backend-${REPO_NAME}

management:
  endpoints:
    web:
      exposure:
        include: health,info
